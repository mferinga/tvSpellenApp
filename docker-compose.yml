services:
  mongo:
    image: mongo:8
    container_name: tvspellen-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: tvspellen-neo4j
    restart: unless-stopped
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -a bolt://localhost:7687 -u neo4j -p password "RETURN 1;"']
      interval: 10s
      timeout: 5s
      retries: 20

  speldata-api:
    # image: node:20-bookworm
    build:
      context: .
      dockerfile: apps/speldata-api/Dockerfile
    container_name: tvspellen-speldata-api
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3333
      JWT_SECRET: spellenAvondSecreyKey
      MONGODB_URI: mongodb://mongo:27017/TvSpellenApp
      FRONTEND_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://159.69.146.203:4200
    ports:
      - '3333:3333'
    volumes:
      # - .:/workspace
      - node_modules:/workspace/node_modules

  recom-api:
    image: node:20-bookworm
    container_name: tvspellen-recom-api
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      PORT: 3001
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
    command:
      [
        'sh',
        '-lc',
        'npm install && npm exec nx -- serve @org/recom-api'
      ]
    ports:
      - '3001:3001'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules

  tvspellen-web:
    image: node:20-bookworm
    container_name: tvspellen-web
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      speldata-api:
        condition: service_started
      recom-api:
        condition: service_started
    command:
      [
        'sh',
        '-lc',
        'npm install && npm exec nx -- serve @org/tvSpellenWebApp --host 0.0.0.0'
      ]
    ports:
      - '4200:4200'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules

volumes:
  mongo_data:
  neo4j_data:
  node_modules:
